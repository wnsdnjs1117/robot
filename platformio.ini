; ============================================================
;  PlatformIO 설정 - Arduino UNO + TETRIX PRIZM
; ============================================================
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
; main_lift_test.cpp 제외 (setup/loop 중복 방지)
build_src_filter = +<*> -<main_lift_test.cpp>

; ── 리프트 단독 테스트 환경 ──────────────────────────────────
[env:lift_test]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
build_src_filter = -<*> +<main_lift_test.cpp>
