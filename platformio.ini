; ============================================================
;  PlatformIO 설정 - Arduino UNO + TETRIX PRIZM
; ============================================================
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600

; PRIZM 라이브러리는 lib/TETRIX_PRIZM/ 폴더에 직접 넣으면
; PlatformIO가 자동으로 인식해서 컴파일합니다.

; ── 리프트 단독 테스트 환경 ──────────────────────────────────
[env:lift_test]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
src_dir = src_lift_test
