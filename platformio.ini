; ============================================================
;  PlatformIO 설정 - Arduino UNO + TETRIX PRIZM
; ============================================================
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
build_flags =
  -Os
  -flto
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
; TestMode.cpp 는 내부가 전부 #if RUN_TEST_MODE==1 로 감싸여 있어
; RUN_TEST_MODE==0 일 때는 빈 오브젝트로 컴파일된다(LTO가 제거 → 용량 영향 없음).
; 따라서 빌드에서 제외하지 않고 Config.h 의 RUN_TEST_MODE 하나로만 모드를 전환한다.
build_src_filter = +<*>

; PRIZM 라이브러리는 lib/TETRIX_PRIZM/ 폴더에 직접 넣으면
; PlatformIO가 자동으로 인식해서 컴파일합니다.
