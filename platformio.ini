; ============================================================
;  PlatformIO 설정 - Arduino UNO + TETRIX PRIZM
; ============================================================
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
build_flags =
  -Os
  -flto
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
build_src_filter = +<*> -<TestMode.cpp>

; PRIZM 라이브러리는 lib/TETRIX_PRIZM/ 폴더에 직접 넣으면
; PlatformIO가 자동으로 인식해서 컴파일합니다.
